name: cineflix_app
description: "CineFlix Media Official Mobile App for Film, OTT & Theatre News"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_widget_from_html: ^0.15.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  app_links: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  image_picker: ^1.2.4
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
